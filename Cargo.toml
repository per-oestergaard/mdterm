[package]
name = "mdterm"
version = "2.0.0"
edition = "2024"
description = "A terminal-based Markdown viewer with syntax highlighting and interactive navigation"
license = "MIT"
repository = "https://github.com/bahdotsh/mdterm"
keywords = ["markdown", "terminal", "viewer", "tui", "cli"]
exclude = ["demo.gif", "demo.cast", "screenshots/", "test.md", "test_linked.md"]
categories = ["command-line-utilities"]

[dependencies]
pulldown-cmark = "0.13.4"
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
syntect = { version = "5.3.0", default-features = false, features = [
  "default-fancy",
] }
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.13.1"
open = "5.4.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4+spec-1.1.0"
dirs = "6.0.0"
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
  "ico",
  "tiff",
] }
libc = "0.2.189"
base64 = "0.23.1"
ureq = "3.4.0"
unicode-width = "0.2.2"
notify = "8.2.0"
serde_json = "1.0.151"
resvg = "0.48.1"
zip = "8.6.0"
url = "2.5.8"
